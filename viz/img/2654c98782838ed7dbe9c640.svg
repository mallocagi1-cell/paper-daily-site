<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278" width="100%" role="img" aria-label="Feature blending, shared pipeline trimming, and asynchronous constrained search loop" font-family="Arial, Helvetica, sans-serif" style="background:#FBF6EC">
    <defs>
      <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#925018" />
      </marker>
      <marker id="arr-sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#286B46" />
      </marker>
      <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#655F56" />
      </marker>
    </defs>
    <rect x="14" y="18" width="184" height="82" rx="8" fill="#F7EBDD" stroke="#D5B58E" stroke-width="1.5" />
    <text x="106" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1F1D1A">1. Multi-Source Blend</text>
    <text x="106" y="60" text-anchor="middle" font-size="10.5" fill="#3D3933">Incumbent + Pareto / Slice FI</text>
    <text x="106" y="78" text-anchor="middle" font-size="10.2" fill="#655F56">Dedup by π, take top n_c / cat.</text>
    <line x1="198" y1="59" x2="234" y2="59" stroke="#925018" stroke-width="1.8" marker-end="url(#arr-amber)" />
    <rect x="238" y="18" width="204" height="82" rx="8" fill="#F7EBDD" stroke="#925018" stroke-width="1.5" />
    <text x="340" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1F1D1A">2. Pre-Train Pipeline Trimming</text>
    <text x="340" y="60" text-anchor="middle" font-size="10.5" fill="#3D3933">Per-pool check: Δ_b(S) ≤ τ·C_b(I)</text>
    <text x="340" y="78" text-anchor="middle" font-size="10.2" fill="#655F56">Drop costliest new → backfill pool b</text>
    <line x1="442" y1="59" x2="478" y2="59" stroke="#286B46" stroke-width="1.8" marker-end="url(#arr-sage)" />
    <rect x="482" y="18" width="184" height="82" rx="8" fill="none" stroke="#286B46" stroke-width="1.5" />
    <text x="574" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1F1D1A">3. Async Train &amp; Early-Stop</text>
    <text x="574" y="60" text-anchor="middle" font-size="10.5" fill="#3D3933">Fast loop refills · Slow loop caps ρ_k</text>
    <text x="574" y="78" text-anchor="middle" font-size="10.2" fill="#655F56">Stop over-cap · Hard-rule winner</text>
    <rect x="14" y="136" width="302" height="124" rx="8" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
    <text x="28" y="158" font-size="11.5" font-weight="600" fill="#1F1D1A">Shared Pipeline Attribution (Trimming Core)</text>
    <rect x="28" y="170" width="274" height="34" rx="5" fill="none" stroke="#AC3B30" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="36" y="191" font-size="10" fill="#AC3B30">New feat. X (unused in pool b) → +cost · drop first</text>
    <rect x="28" y="214" width="274" height="34" rx="5" fill="none" stroke="#286B46" stroke-width="1.2" />
    <text x="36" y="235" font-size="10" fill="#286B46">Same-cat. Y (used in pool b) → +0 in pool b · backfill</text>
    <rect x="336" y="136" width="330" height="124" rx="8" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
    <text x="350" y="158" font-size="11.5" font-weight="600" fill="#1F1D1A">LLM Researcher Proposal Loop (K ≈ 10–25)</text>
    <text x="350" y="180" font-size="10.2" fill="#3D3933">In: full history H + guide G + FI facts + steering</text>
    <text x="350" y="200" font-size="10.2" fill="#3D3933">Families: greedy · exploration · evolutionary · recipe</text>
    <text x="350" y="220" font-size="10.2" fill="#655F56">Out: θ = (n, π) → validator blocks dupes/out-of-range</text>
    <path d="M 574 100 L 574 132" stroke="#655F56" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-muted)" />
    <path d="M 336 168 L 322 168 L 322 118 L 106 118 L 106 104" fill="none" stroke="#925018" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-amber)" />
    <text x="182" y="114" font-size="10" fill="#925018">Submit valid proposal θ</text>
    <text x="582" y="120" font-size="10" fill="#655F56">Log NE &amp; res.</text>
  </svg>