<text x="200" y="542" text-anchor="middle" font-size="14" fill="#655F56">Note: Curves show Fig. 6 directional trends;</text>
<text x="200" y="563" text-anchor="middle" font-size="14" fill="#655F56">no layer-by-layer numeric table in paper</text>
<rect x="18" y="578" width="364" height="82" rx="8" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
<text x="200" y="602" text-anchor="middle" font-size="14" fill="#3D3933">Test Top-1 in-candidate rate reaches</text>
<text x="200" y="625" text-anchor="middle" font-size="14" fill="#3D3933">99.98%–100.00% (Table 8), but the paper</text>
