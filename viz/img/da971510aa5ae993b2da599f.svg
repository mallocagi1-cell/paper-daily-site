<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 79 400 599" role="img" aria-label="Encoder input segmentation and 4-layer Decoder cross-attention trend schematic" font-family="Arial, Helvetica, sans-serif" style="background:#FBF6EC">
<rect x="4" y="4" width="392" height="670" rx="12" fill="#F7EBDD" stroke="#D5B58E" stroke-width="1.5" />
<text x="18" y="108" font-size="15.5" font-weight="700" fill="#1F1D1A">A. Encoder Split &amp; Metric (Eq. 10)</text>
<rect x="18" y="120" width="176" height="58" rx="6" fill="#286B46" fill-opacity="0.14" stroke="#286B46" stroke-width="1.4" />
<text x="106" y="144" text-anchor="middle" font-size="14.5" font-weight="700" fill="#286B46">History (p2 → p3)</text>
<text x="106" y="167" text-anchor="middle" font-size="14.5" fill="#3D3933">history_attention</text>
<rect x="206" y="120" width="176" height="58" rx="6" fill="#925018" fill-opacity="0.16" stroke="#925018" stroke-width="1.4" />
<text x="294" y="144" text-anchor="middle" font-size="14.5" font-weight="700" fill="#925018">Candidates (after p3)</text>
<text x="294" y="167" text-anchor="middle" font-size="14.5" fill="#3D3933">cand_attention</text>
<rect x="18" y="188" width="364" height="90" rx="6" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
<text x="30" y="213" font-size="14.5" font-weight="700" fill="#1F1D1A">Observed at: Decoder start token &lt;s&gt;</text>
<text x="30" y="238" font-size="14" fill="#3D3933">Mean over segment tokens &amp; all heads, then:</text>
<text x="30" y="263" font-size="14.5" font-weight="700" fill="#1F1D1A">Ratio = cand / (cand + history)</text>
<line x1="18" y1="294" x2="382" y2="294" stroke="#E4D9C6" stroke-width="1.2" stroke-dasharray="4 3" />
<text x="18" y="320" font-size="15.5" font-weight="700" fill="#1F1D1A">B. 4-Layer Decoder Cand Ratio (Fig. 6)</text>
