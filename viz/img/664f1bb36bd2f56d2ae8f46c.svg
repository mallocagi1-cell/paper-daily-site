<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 400 564" role="img" aria-label="Dual-path training and single-path inference diagram for TIGER with the multiple-choice auxiliary task" font-family="Arial, Helvetica, sans-serif" style="background:#FBF6EC">
