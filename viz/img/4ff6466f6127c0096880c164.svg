<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 278" width="100%" role="img" aria-label="特征混排、共享管线裁剪与异步约束搜索闭环" font-family="Arial, Helvetica, sans-serif" style="background:#FBF6EC">
    <defs>
      <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#925018" />
      </marker>
      <marker id="arr-sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#286B46" />
      </marker>
      <marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#655F56" />
      </marker>
    </defs>
    <rect x="14" y="18" width="184" height="82" rx="8" fill="#F7EBDD" stroke="#D5B58E" stroke-width="1.5" />
    <text x="106" y="40" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F1D1A">1. 多源混排 Blend</text>
    <text x="106" y="60" text-anchor="middle" font-size="11" fill="#3D3933">现役基线 + Pareto / 切片 FI</text>
    <text x="106" y="78" text-anchor="middle" font-size="11" fill="#655F56">按 π 去重拼榜，每类取前 n_c 维</text>
    <line x1="198" y1="59" x2="234" y2="59" stroke="#925018" stroke-width="1.8" marker-end="url(#arr-amber)" />
    <rect x="238" y="18" width="204" height="82" rx="8" fill="#F7EBDD" stroke="#925018" stroke-width="1.5" />
    <text x="340" y="40" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F1D1A">2. 训练前管线 Trimming</text>
    <text x="340" y="60" text-anchor="middle" font-size="11" fill="#3D3933">按单池查表裁剪 Δ_b(S) ≤ τ·C_b(I)</text>
    <text x="340" y="78" text-anchor="middle" font-size="11" fill="#655F56">踢最贵新增 → 补当前池已用特征</text>
    <line x1="442" y1="59" x2="478" y2="59" stroke="#286B46" stroke-width="1.8" marker-end="url(#arr-sage)" />
    <rect x="482" y="18" width="184" height="82" rx="8" fill="none" stroke="#286B46" stroke-width="1.5" />
    <text x="574" y="40" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F1D1A">3. 异步训练与早停</text>
    <text x="574" y="60" text-anchor="middle" font-size="11" fill="#3D3933">快循环补并发槽 · 慢循环卡 ρ_k</text>
    <text x="574" y="78" text-anchor="middle" font-size="11" fill="#655F56">超限即停 · 终选由硬规则锁死</text>
    <rect x="14" y="136" width="302" height="124" rx="8" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
    <text x="28" y="158" font-size="12" font-weight="600" fill="#1F1D1A">跨模型共享管线归因（Trimming 替换核心）</text>
    <rect x="28" y="170" width="274" height="34" rx="5" fill="none" stroke="#AC3B30" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="38" y="191" font-size="10.8" fill="#AC3B30">新增特征 X（当前池 b 无他模使用）→ 新增归因成本 · 优先剔除</text>
    <rect x="28" y="214" width="274" height="34" rx="5" fill="none" stroke="#286B46" stroke-width="1.2" />
    <text x="38" y="235" font-size="10.8" fill="#286B46">同类候补 Y（当前池 b 他模已用）→ 该池新增 = 0 · 等量回填</text>
    <rect x="336" y="136" width="330" height="124" rx="8" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
    <text x="350" y="158" font-size="12" font-weight="600" fill="#1F1D1A">LLM Researcher 提案闭环（K ≈ 10–25 次）</text>
    <text x="350" y="180" font-size="10.8" fill="#3D3933">输入：完整试验历史 H + 调优指南 G + FI 统计摘要 + 人工引导</text>
    <text x="350" y="200" font-size="10.8" fill="#3D3933">策略族：greedy · exploration · evolutionary · recipe</text>
    <text x="350" y="220" font-size="10.8" fill="#655F56">输出提案 θ = (n, π) → 确定性校验器拦截重复/越界</text>
    <path d="M 574 100 L 574 132" stroke="#655F56" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-muted)" />
    <path d="M 336 168 L 322 168 L 322 118 L 106 118 L 106 104" fill="none" stroke="#925018" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-amber)" />
    <text x="195" y="114" font-size="10.5" fill="#925018">提交合法提案 θ</text>
    <text x="582" y="120" font-size="10.5" fill="#655F56">回写 NE 与资源</text>
  </svg>