<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 79 400 599" role="img" aria-label="Encoder 输入分段与 4 层 Decoder Cross-Attention 趋势示意图" font-family="Arial, Helvetica, sans-serif" style="background:#FBF6EC">
