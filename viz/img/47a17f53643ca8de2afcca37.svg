<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" width="100%" role="img" aria-label="Cross-task Pareto front peeling and multi-source sequential deduplication blending diagram" font-family="Arial, Helvetica, sans-serif" style="background:#FBF6EC">
    <defs>
      <marker id="arr-p1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#AC3B30" />
      </marker>
      <marker id="arr-p2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#925018" />
      </marker>
    </defs>
    <rect x="12" y="12" width="316" height="222" rx="8" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
    <text x="26" y="34" font-size="11.5" font-weight="600" fill="#1F1D1A">1. Cross-Task Pareto Front Peeling (2D Example)</text>
    <line x1="52" y1="196" x2="304" y2="196" stroke="#655F56" stroke-width="1.2" />
    <line x1="52" y1="196" x2="52" y2="48" stroke="#655F56" stroke-width="1.2" />
    <text x="252" y="211" font-size="10" fill="#655F56">Task 1 (f₁)</text>
    <text x="16" y="60" font-size="10" fill="#655F56">Task 2</text>
    <text x="24" y="72" font-size="10" fill="#655F56">(f₂)</text>
    <path d="M 88 64 Q 210 68 272 184" fill="none" stroke="#925018" stroke-width="1.8" />
    <path d="M 76 100 Q 170 104 222 186" fill="none" stroke="#286B46" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M 66 136 Q 130 138 168 188" fill="none" stroke="#655F56" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="275" y="182" font-size="11" font-weight="600" fill="#925018">P₁</text>
    <text x="226" y="184" font-size="10.5" fill="#286B46">P₂</text>
    <text x="172" y="186" font-size="10.5" fill="#655F56">P₃</text>
    <circle cx="176" cy="85" r="4.5" fill="#925018" />
    <text x="184" y="81" font-size="11" font-weight="600" fill="#1F1D1A">A</text>
    <circle cx="237" cy="133" r="4.5" fill="#925018" />
    <text x="245" y="131" font-size="11" font-weight="600" fill="#1F1D1A">B</text>
    <circle cx="144" cy="116" r="4.5" fill="#286B46" />
    <text x="131" y="128" font-size="11" font-weight="600" fill="#1F1D1A">C</text>
    <line x1="171" y1="90" x2="149" y2="111" stroke="#AC3B30" stroke-width="1.4" marker-end="url(#arr-p1)" />
    <text x="160" y="114" font-size="9.5" fill="#AC3B30">A dominates C</text>
    <text x="24" y="226" font-size="9.5" fill="#3D3933">Peel whole fronts P₁ → P₂ → … outside-in, no task weights</text>
    <rect x="342" y="12" width="326" height="222" rx="8" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
    <text x="356" y="34" font-size="11.5" font-weight="600" fill="#1F1D1A">2. Sequential Dedup Blending by π (Quota n_c)</text>
    <rect x="354" y="50" width="166" height="40" rx="6" fill="#F7EBDD" stroke="#D5B58E" stroke-width="1.2" />
    <text x="364" y="66" font-size="10.5" font-weight="600" fill="#1F1D1A">Source 1 · Incumbent (π₁)</text>
    <text x="364" y="82" font-size="10" fill="#3D3933">Top: f₁, f₂, f₃…</text>
    <rect x="354" y="102" width="166" height="40" rx="6" fill="none" stroke="#286B46" stroke-width="1.2" />
    <text x="364" y="118" font-size="10.5" font-weight="600" fill="#1F1D1A">Source 2 · Pareto (π₂)</text>
    <text x="364" y="134" font-size="10" fill="#3D3933">Top: f₂ (skip), f₄, f₅…</text>
    <rect x="354" y="154" width="166" height="40" rx="6" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
    <text x="364" y="170" font-size="10.5" font-weight="600" fill="#1F1D1A">Source 3 · Slice FI (π₃)</text>
    <text x="364" y="186" font-size="10" fill="#3D3933">Top: f₁ (skip), f₆…</text>
    <line x1="520" y1="70" x2="548" y2="70" stroke="#925018" stroke-width="1.4" marker-end="url(#arr-p2)" />
    <line x1="520" y1="122" x2="548" y2="122" stroke="#925018" stroke-width="1.4" marker-end="url(#arr-p2)" />
    <line x1="520" y1="174" x2="548" y2="174" stroke="#925018" stroke-width="1.4" marker-end="url(#arr-p2)" />
    <rect x="554" y="50" width="102" height="144" rx="6" fill="#F7EBDD" stroke="#925018" stroke-width="1.4" />
    <text x="605" y="68" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F1D1A">Cat. c Blend</text>
    <text x="564" y="88" font-size="10" fill="#3D3933">1. f₁ (Src 1)</text>
    <text x="564" y="106" font-size="10" fill="#3D3933">2. f₂ (Src 1)</text>
    <text x="564" y="124" font-size="10" fill="#286B46">3. f₄ (Src 2)</text>
    <text x="564" y="142" font-size="10" fill="#286B46">4. f₅ (Src 2)</text>
    <text x="564" y="160" font-size="10" fill="#655F56">5. f₆ (Src 3)</text>
    <text x="605" y="184" text-anchor="middle" font-size="9.8" font-weight="600" fill="#925018">Truncate to n_c</text>
    <text x="354" y="226" font-size="9.5" fill="#3D3933">Fill round(π_m·n_c) slots in order, skipping duplicates</text>
  </svg>