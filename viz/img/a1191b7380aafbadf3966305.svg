<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" width="100%" role="img" aria-label="CACO bounded tangent-space retraction, antithetic perturbations, and counterfactual single-query replacement" font-family="Arial, Helvetica, sans-serif" style="background:#FBF6EC">
  <defs>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#925018" />
    </marker>
    <marker id="arr-sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#286B46" />
    </marker>
    <marker id="arr-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#AC3B30" />
    </marker>
  </defs>
  <rect x="12" y="12" width="312" height="248" rx="10" fill="#F7EBDD" stroke="#D5B58E" stroke-width="1.2" />
  <text x="26" y="34" fill="#1F1D1A" font-size="12.2" font-weight="700">1. Bounded Tangent Update &amp; Antithetic Noise</text>
  <text x="26" y="51" fill="#3D3933" font-size="10.4">Symmetric tangent noise, then radial retraction</text>
  <line x1="26" y1="154" x2="310" y2="154" stroke="#655F56" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="28" y="144" fill="#655F56" font-size="9.5">Tangent T_i</text>
  <path d="M 56 213.6 A 135 135 0 0 1 280 213.6" fill="none" stroke="#3D3933" stroke-width="1.8" />
  <line x1="168" y1="154" x2="186" y2="154" stroke="#925018" stroke-width="2.6" marker-end="url(#arr-amber)" />
  <line x1="190" y1="118" x2="282" y2="118" stroke="#286B46" stroke-width="1.8" marker-end="url(#arr-sage)" />
  <line x1="190" y1="118" x2="98" y2="118" stroke="#AC3B30" stroke-width="1.8" marker-end="url(#arr-coral)" />
  <line x1="190" y1="118" x2="190" y2="150" stroke="#925018" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="286" y1="118" x2="286" y2="150" stroke="#286B46" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="94" y1="118" x2="94" y2="150" stroke="#AC3B30" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="286" y1="154" x2="256.9" y2="187.4" stroke="#286B46" stroke-width="1.3" stroke-dasharray="3 2" />
  <line x1="256.9" y1="187.4" x2="236" y2="211" stroke="#286B46" stroke-width="0.9" stroke-opacity="0.45" stroke-dasharray="2 3" />
  <line x1="94" y1="154" x2="103.1" y2="170.6" stroke="#AC3B30" stroke-width="1.3" stroke-dasharray="3 2" />
  <line x1="103.1" y1="170.6" x2="116" y2="194" stroke="#AC3B30" stroke-width="0.9" stroke-opacity="0.45" stroke-dasharray="2 3" />
  <text x="238" y="110" fill="#286B46" font-size="10.5" text-anchor="middle" font-weight="600">+σP_i(ε_i)</text>
  <text x="142" y="110" fill="#AC3B30" font-size="10.5" text-anchor="middle" font-weight="600">-σP_i(ε_i)</text>
  <circle cx="168" cy="154" r="4.3" fill="#1F1D1A" />
  <circle cx="190" cy="154" r="3.8" fill="#925018" />
  <circle cx="286" cy="154" r="3.5" fill="#286B46" />
  <circle cx="94" cy="154" r="3.5" fill="#AC3B30" />
  <circle cx="256.9" cy="187.4" r="4.6" fill="#286B46" />
  <circle cx="103.1" cy="170.6" r="4.6" fill="#AC3B30" />
  <text x="190" y="144" fill="#925018" font-size="10.8" text-anchor="middle" font-weight="700">μ_i</text>
  <text x="286" y="144" fill="#286B46" font-size="10.5" text-anchor="middle">μ_i⁺</text>
  <text x="94" y="144" fill="#AC3B30" font-size="10.5" text-anchor="middle">μ_i⁻</text>
  <text x="168" y="175" fill="#1F1D1A" font-size="10.2" text-anchor="middle" font-weight="600">q̇_i (frozen init)</text>
  <text x="276" y="196" fill="#286B46" font-size="11" text-anchor="start" font-weight="700">q_i⁺</text>
  <text x="88" y="182" fill="#AC3B30" font-size="11" text-anchor="end" font-weight="700">q_i⁻</text>
  <text x="174" y="218" fill="#3D3933" font-size="9.5" text-anchor="middle">Dashed lines to center: radial retraction R_i</text>
  <text x="168" y="246" fill="#655F56" font-size="10" text-anchor="middle">Unit hypersphere S^{d-1} · ||μ_i|| &lt; ρ = tan 32°</text>
  <rect x="338" y="12" width="330" height="248" rx="10" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
  <text x="352" y="34" fill="#1F1D1A" font-size="12.2" font-weight="700">2. Single-Query Counterfactual &amp; 2L Reuse</text>
  <text x="352" y="51" fill="#3D3933" font-size="10.2">Fix other L-1 queries; swap only i for marginal gain</text>
  <text x="352" y="80" fill="#1F1D1A" font-size="11.5" font-weight="700">Q⁺</text>
  <rect x="380" y="62" width="166" height="28" rx="6" fill="#F7EBDD" stroke="#D5B58E" />
  <text x="463" y="80" fill="#3D3933" font-size="10" text-anchor="middle">Other L-1 pos. queries (U_{-i})</text>
  <rect x="554" y="62" width="100" height="28" rx="6" fill="#286B46" fill-opacity="0.18" stroke="#286B46" />
  <text x="604" y="80" fill="#286B46" font-size="10.5" text-anchor="middle" font-weight="700">q_i⁺ results</text>
  <text x="352" y="122" fill="#1F1D1A" font-size="11.5" font-weight="700">Q⁽ⁱ⁾</text>
  <rect x="380" y="104" width="166" height="28" rx="6" fill="#F7EBDD" stroke="#D5B58E" />
  <text x="463" y="122" fill="#655F56" font-size="10" text-anchor="middle">Other L-1 fixed (cancel out)</text>
  <rect x="554" y="104" width="100" height="28" rx="6" fill="#AC3B30" fill-opacity="0.16" stroke="#AC3B30" />
  <text x="604" y="122" fill="#AC3B30" font-size="10.5" text-anchor="middle" font-weight="700">Swap in q_i⁻</text>
  <rect x="352" y="147" width="302" height="50" rx="8" fill="#F7EBDD" stroke="#D5B58E" />
  <text x="503" y="168" fill="#1F1D1A" font-size="11.5" text-anchor="middle" font-weight="700">Δ_i = [ F_h(Q⁺) − F_h(Q⁽ⁱ⁾) ] / Z_h</text>
  <text x="503" y="186" fill="#3D3933" font-size="9.8" text-anchor="middle">New weight diff only: A_K(q_i⁺)\U_{-i} vs. A_K(q_i⁻)\U_{-i}</text>
  <rect x="352" y="208" width="302" height="40" rx="8" fill="none" stroke="#286B46" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="503" y="224" fill="#286B46" font-size="10.3" text-anchor="middle" font-weight="700">Only 2L ANN calls/step: cache all q_i⁺ &amp; q_i⁻ sets</text>
  <text x="503" y="240" fill="#3D3933" font-size="9.8" text-anchor="middle">In-memory set diffs → unbiased smoothed-coverage grad</text>
</svg>