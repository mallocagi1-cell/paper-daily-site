<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 400 564" role="img" aria-label="TIGER 多选辅助任务双路训练与单路推理结构图" font-family="Arial, Helvetica, sans-serif" style="background:#FBF6EC">
<rect x="4" y="4" width="392" height="612" rx="12" fill="#F7EBDD" stroke="#D5B58E" stroke-width="1.5" />
<rect x="18" y="68" width="342" height="92" rx="8" fill="none" stroke="#286B46" stroke-width="1.6" />
<text x="28" y="92" font-size="16" font-weight="700" fill="#286B46">主任务（训练 + 验证/推理）</text>
<rect x="28" y="104" width="38" height="30" rx="5" fill="#286B46" fill-opacity="0.18" stroke="#286B46" stroke-width="1.2" />
<text x="47" y="124" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1F1D1A">p1</text>
<rect x="72" y="104" width="278" height="30" rx="5" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
<text x="211" y="124" text-anchor="middle" font-size="15" fill="#3D3933">历史序列 s_u,t (SID_1 SID_3 ...)</text>
<text x="28" y="151" font-size="15" fill="#655F56">不拼候选集</text>
<rect x="18" y="172" width="342" height="150" rx="8" fill="none" stroke="#925018" stroke-width="1.6" stroke-dasharray="5 3" />
<text x="28" y="196" font-size="15" font-weight="700" fill="#925018">多选辅助任务（仅训练，每 epoch 刷新负例）</text>
<rect x="28" y="208" width="36" height="30" rx="5" fill="#925018" fill-opacity="0.22" stroke="#925018" stroke-width="1.2" />
<text x="46" y="228" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1F1D1A">p2</text>
<rect x="70" y="208" width="104" height="30" rx="5" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
<text x="122" y="228" text-anchor="middle" font-size="15" fill="#3D3933">历史 s_u,t</text>
<rect x="180" y="208" width="36" height="30" rx="5" fill="#AC3B30" fill-opacity="0.18" stroke="#AC3B30" stroke-width="1.2" />
<text x="198" y="228" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1F1D1A">p3</text>
<rect x="222" y="208" width="128" height="30" rx="5" fill="none" stroke="#925018" stroke-width="1.2" />
<text x="286" y="228" text-anchor="middle" font-size="15" fill="#3D3933">乱序 c_u,t</text>
<text x="28" y="258" font-size="15" fill="#3D3933">候选集 c_u,t：1正 + nc-1负</text>
<text x="28" y="281" font-size="15" fill="#655F56">负例采自 I \ (s_u,t ∪ {i_u,t})，</text>
<text x="28" y="304" font-size="15" fill="#655F56">按乱序逐物品展开 SID 串接</text>
<polyline points="360,114 378,114 378,389 360,389" fill="none" stroke="#286B46" stroke-width="2" />
<polygon points="360,389 368,384 368,394" fill="#286B46" />
<line x1="189" y1="322" x2="189" y2="348" stroke="#925018" stroke-width="2" stroke-dasharray="4 3" />
<polygon points="189,348 184,339 194,339" fill="#925018" />
<rect x="18" y="348" width="342" height="82" rx="10" fill="none" stroke="#1F1D1A" stroke-width="1.6" />
<text x="189" y="374" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1F1D1A">共享主干</text>
<text x="189" y="397" text-anchor="middle" font-size="15.5" fill="#3D3933">Transformer Encoder-Decoder</text>
<text x="189" y="419" text-anchor="middle" font-size="15" fill="#655F56">无 LLM 预训练权重</text>
<line x1="189" y1="430" x2="189" y2="443" stroke="#1F1D1A" stroke-width="1.8" />
<line x1="106" y1="443" x2="294" y2="443" stroke="#1F1D1A" stroke-width="1.8" />
<line x1="106" y1="443" x2="106" y2="456" stroke="#1F1D1A" stroke-width="1.8" />
<polygon points="106,456 101,448 111,448" fill="#1F1D1A" />
<line x1="294" y1="443" x2="294" y2="456" stroke="#1F1D1A" stroke-width="1.8" />
<polygon points="294,456 289,448 299,448" fill="#1F1D1A" />
<rect x="18" y="456" width="176" height="68" rx="8" fill="none" stroke="#286B46" stroke-width="1.6" />
<text x="106" y="483" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1F1D1A">统一解码目标</text>
<text x="106" y="508" text-anchor="middle" font-size="15" fill="#286B46">Target SID i_u,t</text>
<rect x="206" y="456" width="176" height="68" rx="8" fill="none" stroke="#E4D9C6" stroke-width="1.3" />
<text x="294" y="483" text-anchor="middle" font-size="15" font-weight="700" fill="#1F1D1A">L = L_main + L_aux</text>
<text x="294" y="508" text-anchor="middle" font-size="15" fill="#655F56">两路共享解码头</text>
<rect x="18" y="538" width="364" height="64" rx="8" fill="none" stroke="#E4D9C6" stroke-width="1.2" />
<text x="200" y="563" text-anchor="middle" font-size="15" fill="#3D3933">验证与推理仅走 [p1, s_u,t] + 受限束搜索</text>
<text x="200" y="587" text-anchor="middle" font-size="15" fill="#3D3933">仅增 1 个前缀 token，不构造候选集</text>
</svg>