<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Why distillation uses two candidate distributions</title><desc id="desc">Current decoder candidates teach serving-time selection; logged impressions anchor observed feedback. A teacher supervises the shared-encoder ranking head during training only.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#475569"/></marker></defs>
<rect width="1200" height="530" rx="20" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#172554"><text x="45" y="48" font-size="26" font-weight="bold">Train on what the model generates AND what users saw</text>
<g fill="#dbeafe" stroke="#93c5fd" stroke-width="2"><rect x="45" y="90" width="310" height="115" rx="14"/><rect x="45" y="245" width="310" height="115" rx="14"/></g>
<text x="65" y="125" font-size="22" font-weight="bold">Current decoder rollouts</text><text x="65" y="160" font-size="18">Serving-like candidates</text><text x="65" y="186" font-size="18">Teacher scores unexposed items</text>
<text x="65" y="280" font-size="22" font-weight="bold">Logged impressions</text><text x="65" y="315" font-size="18">Previously exposed items</text><text x="65" y="341" font-size="18">Complementary coverage</text>
<g fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"><rect x="465" y="145" width="265" height="155" rx="14"/></g>
<text x="492" y="185" font-size="23" font-weight="bold">Training-only teacher</text><text x="492" y="224" font-size="18">Score each candidate pool</text><text x="492" y="253" font-size="18">Normalize each loss separately</text><text x="492" y="281" font-size="18">Equal source coefficients</text>
<rect x="840" y="145" width="310" height="155" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
<text x="865" y="185" font-size="23" font-weight="bold">Shared-state ranking head</text><text x="865" y="224" font-size="18">Learn item-level preferences</text><text x="865" y="253" font-size="18">Reuse the history encoder</text><text x="865" y="281" font-size="18">Teacher absent at serving</text>
<g fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"><path d="M355 147 L410 147 L410 195 L465 195"/><path d="M355 302 L410 302 L410 250 L465 250"/><path d="M730 223 L840 223"/></g>
<rect x="45" y="405" width="1105" height="80" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
<text x="67" y="438" font-size="20" font-weight="bold">Ablation: teacher top-10 agreement</text><text x="67" y="468" font-size="20">Impressions only: 0.2983 → Mixed pools: 0.5654</text><text x="700" y="467" font-size="17">Agreement with a teacher is not user utility.</text>
<text x="45" y="514" font-size="14" fill="#64748b">Explanatory diagram from Gryphon-v2 §3.6 and Table 3; values are descriptive offline estimates.</text></g></svg>
