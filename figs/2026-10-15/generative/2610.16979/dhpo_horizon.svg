<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif" font-size="14">
<rect width="640" height="230" fill="#fff"/>
<text x="20" y="26" font-weight="bold">DHPO：奖励只检查前 h 个码，也只更新这 h 个位置</text>
<g transform="translate(20,50)">
<text x="0" y="22">训练早期 h=1</text>
<rect x="130" y="5" width="70" height="26" fill="#3b82f6"/><rect x="205" y="5" width="70" height="26" fill="#e5e7eb"/><rect x="280" y="5" width="70" height="26" fill="#e5e7eb"/>
<text x="0" y="72">训练中期 h=2</text>
<rect x="130" y="55" width="70" height="26" fill="#3b82f6"/><rect x="205" y="55" width="70" height="26" fill="#3b82f6"/><rect x="280" y="55" width="70" height="26" fill="#e5e7eb"/>
<text x="0" y="122">训练后期 h=3</text>
<rect x="130" y="105" width="70" height="26" fill="#3b82f6"/><rect x="205" y="105" width="70" height="26" fill="#3b82f6"/><rect x="280" y="105" width="70" height="26" fill="#3b82f6"/>
<text x="150" y="160" fill="#555">码 1</text><text x="225" y="160" fill="#555">码 2</text><text x="300" y="160" fill="#555">码 3</text>
<rect x="380" y="5" width="16" height="16" fill="#3b82f6"/><text x="402" y="18">参与奖励与梯度</text>
<rect x="380" y="32" width="16" height="16" fill="#e5e7eb"/><text x="402" y="45">暂不检查、不更新</text>
<text x="380" y="85" fill="#555">每 300 步 h 加 1</text>
<text x="380" y="108" fill="#555">前缀命中同 session 正例：</text>
<text x="380" y="128" fill="#555">点击 = 1，下单 = 2</text>
</g></svg>
