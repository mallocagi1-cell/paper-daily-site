<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14">
<rect width="760" height="300" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#333">同一商品 ID 下的三张创意图（示意）</text>
<g>
<rect x="20" y="50" width="150" height="90" rx="8" fill="#eef3fb" stroke="#7a9cc6"/><text x="95" y="90" text-anchor="middle">创意 A</text><text x="95" y="115" text-anchor="middle" fill="#555">模型分 0.031</text>
<rect x="190" y="50" width="150" height="90" rx="8" fill="#e6f4ea" stroke="#3d8b57" stroke-width="2.5"/><text x="265" y="90" text-anchor="middle" font-weight="bold">创意 B</text><text x="265" y="115" text-anchor="middle" fill="#555">模型分 0.044（最高）</text>
<rect x="360" y="50" width="150" height="90" rx="8" fill="#eef3fb" stroke="#7a9cc6"/><text x="435" y="90" text-anchor="middle">创意 C</text><text x="435" y="115" text-anchor="middle" fill="#555">模型分 0.027</text>
</g>
<text x="20" y="180" fill="#333">日志里这次曝光实际展示的是：</text><rect x="230" y="163" width="70" height="26" rx="5" fill="#e6f4ea" stroke="#3d8b57"/><text x="265" y="181" text-anchor="middle">创意 B</text>
<text x="320" y="181" fill="#3d8b57">→ 模型选中 = 实际展示，算一次“回放匹配”</text>
<text x="20" y="225" fill="#333">每个商品 i：只用匹配上的曝光算点击率 Cᵢ/Mᵢ，再按该商品原始曝光数 Nᵢ 加权平均，得到 NSCTR。</text>
<text x="20" y="252" fill="#333">商品 ID 在候选之间完全相同，ID 特征提供不了区分度，分数差异只能来自图片和文字编码。</text>
<text x="20" y="285" font-size="12" fill="#888">自绘示意图，分数为示意，不是论文数据。</text>
</svg>
